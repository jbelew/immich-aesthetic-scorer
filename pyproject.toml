[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-aesthetic-scorer"
version = "1.3.0"
description = "Aesthetic scorer for Immich using CLIP or Gemini/OpenAI vision models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "requests",
    "tqdm",
    "pillow",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchvision",
    "transformers",
    "simple-aesthetics-predictor",
    "pyiqa",
]

[project.scripts]
immich-aesthetic-scorer = "score_assets:main"

[tool.setuptools]
py-modules = ["score_assets"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "C90", # mccabe complexity
]
ignore = ["E501", "C901"]

[tool.pyright]
include = ["score_assets.py"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
