[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-aesthetic-scorer"
version = "1.5.1"
description = "Aesthetic scorer for Immich using CLIP or Gemini/OpenAI vision models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "requests",
    "tqdm",
    "pillow",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchvision",
    "transformers",
    "huggingface-hub",
    "simple-aesthetics-predictor",
    "pyiqa",
]

[project.scripts]
immich-aesthetic-scorer = "score_assets:main"

[tool.setuptools]
py-modules = ["score_assets"]
packages = ["immich_aesthetic_scorer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "C90", # mccabe complexity
    "D",   # pydocstyle (docstrings)
]
ignore = ["E501", "C901", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103"]

[tool.pyright]
include = ["score_assets.py", "immich_aesthetic_scorer", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
