repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [ --fix ]

  - repo: https://github.com/pre-commit/mirrors-pyright
    rev: v1.1.368
    hooks:
      - id: pyright
        # Ensure it works when run in virtual env
        args: [ --warnings ]

  - repo: local
    hooks:
      - id: run-tests
        name: Run Unit Tests
        entry: .venv/bin/python -m unittest test_score_assets.py
        language: system
        pass_filenames: false
        always_run: true
