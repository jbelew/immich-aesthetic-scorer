repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        # Ensure it works when run in virtual env
        args: [ --warnings ]

  - repo: local
    hooks:
      - id: run-tests
        name: Run Unit Tests
        entry: env CUDA_VISIBLE_DEVICES="" .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
